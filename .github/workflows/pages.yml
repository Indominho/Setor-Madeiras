name: Corrigir login e QR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    if: ${{ !contains(github.event.head_commit.message, '[login-posicao-ok]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reposicionar login e QR
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # O bloco foi inserido na primeira ocorrência textual de "<body",
          # que estava dentro de um comentário CSS. Remove o bloco quebrado.
          s=re.sub(
            r'\s*<!-- login-qr-pages-v1 -->\s*<div id="accessGate">.*?</div>\s*(?=<body data-nav="bottom \| top-right \| hidden">)',
            '',s,count=1,flags=re.S
          )

          # Remove script antigo do login para evitar duplicação.
          s=re.sub(
            r'\s*<script>\s*\(\(\) => \{\s*const gate=document\.getElementById\(\'accessGate\'\);.*?</script>',
            '',s,count=1,flags=re.S
          )

          gate=r'''
          <!-- login-qr-pages-v2 -->
          <div id="accessGate">
            <section class="gate-story">
              <div class="gate-mark">Setor Madeiras · Londrina</div>
              <h1>Decisão com evidência.</h1>
              <p>Apresentação executiva protegida, disponível no Windows, iPhone e Android.</p>
              <div class="gate-qr">
                <img alt="QR code para abrir no celular" src="https://api.qrserver.com/v1/create-qr-code/?size=520x520&ecc=H&data=https%3A%2F%2Findominho.github.io%2FSetor-Madeiras%2F">
                <span>Abrir no celular</span>
              </div>
            </section>
            <section class="gate-panel">
              <form id="accessForm" autocomplete="on">
                <div class="kicker">Acesso restrito</div>
                <h2>Entrar na apresentação</h2>
                <p class="copy">Use as credenciais autorizadas para abrir o conteúdo.</p>
                <div class="field"><label for="accessUser">Usuário</label><div class="input-wrap"><input id="accessUser" inputmode="numeric" autocomplete="username" required autofocus></div></div>
                <div class="field"><label for="accessPass">Senha</label><div class="input-wrap"><input id="accessPass" type="password" autocomplete="current-password" required><button id="accessToggle" type="button">Mostrar</button></div></div>
                <button id="accessSubmit" type="submit">Acessar apresentação</button>
                <div id="accessError" role="alert" aria-live="polite"></div>
              </form>
            </section>
          </div>
          '''

          script=r'''
          <script id="accessGateScript">
          (() => {
            const gate=document.getElementById('accessGate');
            const form=document.getElementById('accessForm');
            const user=document.getElementById('accessUser');
            const pass=document.getElementById('accessPass');
            const toggle=document.getElementById('accessToggle');
            const error=document.getElementById('accessError');
            document.body.classList.add('access-locked');
            toggle.onclick=()=>{const show=pass.type==='password';pass.type=show?'text':'password';toggle.textContent=show?'Ocultar':'Mostrar';pass.focus()};
            form.onsubmit=event=>{event.preventDefault();event.stopPropagation();if(user.value.trim()==='51067271'&&pass.value==='madeiras2026'){gate.remove();document.body.classList.remove('access-locked');document.body.tabIndex=-1;document.body.focus({preventScroll:true})}else{error.textContent='Usuário ou senha incorretos.';pass.focus();pass.select()}return false};
          })();
          </script>
          '''

          # Insere imediatamente depois da tag body real, nunca em comentários.
          s,n=re.subn(r'(<body\b[^>]*>)',r'\1\n'+gate,s,count=1,flags=re.I)
          assert n==1
          s=s.replace('</body>',script+'\n</body>')
          p.write_text(s,encoding='utf-8')

      - name: Validar estrutura
        shell: python {0}
        run: |
          from pathlib import Path
          from html.parser import HTMLParser
          s=Path('index.html').read_text(encoding='utf-8')
          body=s.lower().find('<body')
          gate=s.find('<!-- login-qr-pages-v2 -->')
          assert body >= 0 and gate > body
          assert s.count('id="accessGate"') == 1
          assert s.count('id="accessGateScript"') == 1
          assert '51067271' in s and 'madeiras2026' in s
          assert 'api.qrserver.com' in s
          assert s.count("window.addEventListener('keydown',handle,true)") == 1
          assert 'keyboard-pages-final' not in s

      - name: Salvar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Corrige posição do login e QR [login-posicao-ok]"
          git push
