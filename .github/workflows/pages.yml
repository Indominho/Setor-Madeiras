name: Reposicionar reparo no body real

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reposicionar:
    if: ${{ !contains(github.event.head_commit.message, '[body-real-ok]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mover bloco para depois do body real
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          ini='<!-- reparo-final-inicio -->'
          fim='<!-- reparo-final-fim -->'
          a=s.find(ini)
          b=s.find(fim,a)
          assert a>=0 and b>a
          b+=len(fim)
          block=s[a:b]
          s=s[:a]+s[b:]

          # Procura o body somente após o fechamento real do head.
          pattern=r'(</head>\s*<body\b[^>]*>)'
          s,n=re.subn(pattern,lambda m:m.group(1)+'\n'+block,s,count=1,flags=re.I)
          assert n==1
          p.write_text(s,encoding='utf-8')

      - name: Validar posição e recursos
        shell: python {0}
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'</head>\s*<body\b[^>]*>',s,re.I)
          assert m
          repair=s.find('<!-- reparo-final-inicio -->')
          first_slide=s.find('class="slide-viewport"',m.end())
          assert m.end() < repair < first_slide
          assert s.count('id="finalGate"')==1
          assert s.count('id="finalRepairScript"')==1
          assert s.count('class="slide-viewport"')==15
          assert '51067271' in s and 'madeiras2026' in s
          assert 'Math.min(w/1920,h/1080)' in s
          assert 'stopImmediatePropagation()' in s
          assert 'touchstart' in s and 'orientationchange' in s

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Posiciona login no body real [body-real-ok]"
          git push
