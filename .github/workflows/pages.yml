name: Corrigir apresentação

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    if: ${{ !contains(github.event.head_commit.message, '[teclado-ok]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Corrigir teclado e foco no index
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- keyboard-pages-final -->'
          if marker in s:
              raise SystemExit(0)
          patch = r'''
          <!-- keyboard-pages-final -->
          <script>
          (() => {
            'use strict';
            const total = 15;
            let current = 1;
            const read = () => {
              const m = (location.hash || '').match(/(?:frame|slide)-(\d+)/);
              current = m ? Math.max(1, Math.min(total, Number(m[1]) || 1)) : 1;
            };
            const go = n => {
              current = Math.max(1, Math.min(total, n));
              const frame = document.getElementById(`frame-${current}`);
              const slide = document.getElementById(`slide-${current}`);
              location.hash = frame ? `frame-${current}` : `slide-${current}`;
              (frame || slide)?.focus?.({preventScroll:true});
            };
            const handler = event => {
              const tag = event.target?.tagName || '';
              if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
              const key = event.key;
              const code = event.keyCode || event.which || 0;
              if (['ArrowRight','ArrowDown',' ','PageDown'].includes(key) || [39,40,32,34].includes(code)) {
                event.preventDefault(); event.stopImmediatePropagation(); read(); go(current + 1);
              } else if (['ArrowLeft','ArrowUp','PageUp'].includes(key) || [37,38,33].includes(code)) {
                event.preventDefault(); event.stopImmediatePropagation(); read(); go(current - 1);
              } else if (key === 'Home' || key === 'r' || key === 'R' || code === 36) {
                event.preventDefault(); go(1);
              } else if (key === 'End' || code === 35) {
                event.preventDefault(); go(total);
              } else if (key === 'f' || key === 'F' || code === 70) {
                event.preventDefault();
                if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
                else document.exitFullscreen?.();
              }
            };
            window.addEventListener('keydown', handler, true);
            document.addEventListener('keydown', handler, true);
            window.addEventListener('hashchange', read);
            window.addEventListener('load', () => {
              read(); document.body.tabIndex = -1;
              document.body.focus({preventScroll:true});
            });
            read();
          })();
          </script>
          '''
          s = s.replace('</body>', patch + '\n</body>')
          p.write_text(s, encoding='utf-8')

      - name: Salvar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Corrige teclado da apresentação [teclado-ok]"
          git push
