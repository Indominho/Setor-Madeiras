name: Corrigir navegação

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    if: ${{ !contains(github.event.head_commit.message, '[navegacao-ok]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remover eventos duplicados do teclado
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove a correção adicional que criou um segundo controlador.
          s = re.sub(
              r'\s*<!-- keyboard-pages-final -->\s*<script>.*?</script>',
              '', s, count=1, flags=re.S
          )

          # O controlador portátil registrava a mesma função em window e
          # document. Um único toque era processado duas vezes, pulando pares.
          s = s.replace(
              "window.addEventListener('keydown',handle,true);document.addEventListener('keydown',handle,true);",
              "window.addEventListener('keydown',handle,true);"
          )
          s = s.replace(
              "window.addEventListener('keydown', handler, true);\n            document.addEventListener('keydown', handler, true);",
              "window.addEventListener('keydown', handler, true);"
          )

          if '[navegacao-unica]' not in s:
              s = s.replace('</body>', '<!-- [navegacao-unica] -->\n</body>')

          p.write_text(s, encoding='utf-8')

      - name: Validar controlador único
        shell: python {0}
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'keyboard-pages-final' not in s
          assert "window.addEventListener('keydown',handle,true);document.addEventListener('keydown',handle,true);" not in s
          assert s.count("window.addEventListener('keydown',handle,true)") == 1
          assert '[navegacao-unica]' in s

      - name: Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Corrige avanço duplo do teclado [navegacao-ok]"
          git push
